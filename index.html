  <!-- Restauração imediata do tema da memória (0ms, sem flash) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('yisrael_theme');
        if (t === 'light' || t === 'day') {
          document.documentElement.setAttribute('data-theme', 'day');
        } else if (t === 'dark' || t === 'night') {
          document.documentElement.setAttribute('data-theme', 'night');
        }
      } catch (e) { }
    })();
  </script>
