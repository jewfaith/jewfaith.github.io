    (function () {
      if (window.location.pathname.endsWith('/index.html')) {
        var cleanPath = window.location.pathname.replace(/\/index\.html$/, '/') + window.location.search + window.location.hash;

    // Funções globais do simulador litúrgico disponíveis instantaneamente
    function simulate(f, opt) {
      if (window._simFn) return window._simFn(f, opt);
      return import('./js/utils/simulator.js?v=2.9.45').then(function (m) {
        window._simFn = function (fest, options) {
          if (typeof fest === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(fest.trim())) {
            return m.simulateDate(fest.trim());
          }
          return m.simulateFestival(fest, options);
        };
        return window._simFn(f, opt);
      }).catch(function (err) {
        console.error('[Simulador] Erro ao carregar módulo do simulador:', err);
      });
    }
    function resetSimulation() {
      if (window._simReset) return window._simReset();
      return import('./js/utils/simulator.js?v=2.9.45').then(function (m) {
        window._simReset = m.resetSimulation;
        return m.resetSimulation();
      }).catch(function (err) {
        console.error('[Simulador] Erro ao restaurar simulação:', err);
      });
    }
    function simulationHelp() {
      if (window._simHelp) return window._simHelp();
      return import('./js/utils/simulator.js?v=2.9.45').then(function (m) {
        window._simHelp = m.simulationHelp;
        return m.simulationHelp();
      }).catch(function (err) {
        console.error('[Simulador] Erro ao abrir ajuda:', err);
      });
    }
    window.simulate = simulate;
    window.simulateFestival = simulate;
    window.simulateDate = function (d) {
      return import('./js/utils/simulator.js?v=2.9.45').then(function (m) {
        return m.simulateDate(d);
      }).catch(function (err) {
        console.error('[Simulador] Erro ao simular data:', err);
      });
    };
    window.resetSimulation = resetSimulation;
    window.simulationHelp = simulationHelp;
  </script>
